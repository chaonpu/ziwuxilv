name: Repository maintenance
'on':
  schedule:
  - cron: 17 20 * * 6
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only list candidates; scheduled maintenance also starts in dry-run until explicitly enabled
        type: boolean
        default: true
      release_asset_smoke:
        description: Write, verify and delete a temporary Release Asset
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: repository-maintenance
  cancel-in-progress: false
jobs:
  maintenance:
    if: github.event_name != 'workflow_dispatch' || !inputs.release_asset_smoke
    uses: ./.github/workflows/_actions-maintenance.yml
    permissions:
      actions: write
      contents: read
    with:
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || github.event_name == 'schedule' && vars.MAINTENANCE_DELETE_ENABLED
        != 'true' }}
      implementation_ref: ${{ github.sha }}
  release-asset-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
      with:
        ref: main
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Upload, verify metadata, and delete a temporary Release Asset
      env:
        GH_TOKEN: ${{ github.token }}
        RUN_ID: ${{ github.run_id }}
      run: |
        python - <<'PY'
        import os
        from tools.release_assets import upload_monthly_bytes, delete_asset, release_asset_url_valid
        data = ("ziwuxilv-release-asset-smoke:" + os.environ["RUN_ID"]).encode()
        name = "media-smoke-" + os.environ["RUN_ID"] + ".bin"
        tag, asset = upload_monthly_bytes(name, data, "application/octet-stream")
        assert int(asset["size"]) == len(data)
        assert release_asset_url_valid(asset["browser_download_url"], tag, name)
        delete_asset(int(asset["id"]))
        print("Release Asset smoke passed:", tag, asset["id"])
        PY
    if: github.event_name == 'workflow_dispatch' && inputs.release_asset_smoke
    permissions:
      contents: write
    concurrency:
      group: profile-registry-write
      cancel-in-progress: false
      queue: max
