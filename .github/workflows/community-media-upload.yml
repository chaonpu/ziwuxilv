name: Community image upload

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  upload:
    if: >-
      !github.event.issue.pull_request &&
      startsWith(github.event.comment.body, 'ZIWUXILV_MEDIA_SUBMIT_V1') &&
      github.event.comment.user.id == github.event.issue.user.id
    concurrency:
      group: profile-registry-write
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==12.3.0
      - run: python tools/community_media.py
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Recover committed upload or report failure
        if: failure()
        run: python tools/community_media.py --report-failure
        env:
          GH_TOKEN: ${{ github.token }}
