name: Publish Android v1.4.9

on:
  push:
    paths:
      - ".github/workflows/publish-v1.4.9.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download signed artifact
        env:
          ARTIFACT_URL: "https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-5e44-8211-8787-e73ae961ad23/raw?se=2026-09-28T08%3A47%3A00Z&sp=r&sv=2026-02-06&sr=b&scid=b0da169b-5d60-5ba7-848b-1c16461025f2&skoid=fb469448-2cc9-41bd-a5a6-6e020952b47a&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-28T01%3A58%3A30Z&ske=2026-09-29T01%3A58%3A30Z&sks=b&skv=2026-02-06&sig=BPWjPVVVlC2Jlof2rEpqUUzuQlURba9C8HaI4QfzxVY%3D"
        run: |
          set -euo pipefail
          curl -fL "$ARTIFACT_URL" -o /tmp/v149.zip
          mkdir -p /tmp/v149
          unzip -q /tmp/v149.zip -d /tmp/v149
          echo "37ca66fb24e1ce55e8e4af806f5f5b6fcf62a1e59e898a09b63429d1ebba9637  /tmp/v149/ziwuxilv-native-v1.4.9.apk" | sha256sum -c -
      - name: Publish v1.4.9
        run: |
          set -euo pipefail
          mkdir -p android-native/v1.4.9
          cp /tmp/v149/ziwuxilv-native-v1.4.9.apk android-native/v1.4.9/
          cp /tmp/v149/ziwuxilv-native-v1.4.9.apk.sha256 android-native/v1.4.9/
          cat > android-native/version.json <<'JSON'
          {
            "versionCode": 27,
            "versionName": "1.4.9",
            "downloadUrl": "https://raw.githubusercontent.com/chaonpu/ziwuxilv/main/android-native/v1.4.9/ziwuxilv-native-v1.4.9.apk",
            "updateLog": "行情时效标签继续收紧：明确实时且行情时间正常不显示标签；只有确认具体分钟数时才显示“延时N分”，实时源更新时间异常显示“滞后N分”，无法确认时显示“待核验”，无行情显示“未读取”。A股/美股持仓改为根据腾讯行情实际时间判断实时或滞后，不再默认待核验。行情变化采用约1秒的柔和渐亮渐暗效果，全球与持仓行情均保持接近15秒刷新周期。广场评论默认显示10条、每次再展开10条；单条评论回复默认5条、每次再展开5条，且同一时间只允许一个回复线程展开，切换线程时其他线程自动折叠回5条。帖子和回复新增GitHub App风格右上角菜单，支持分享、引用回复、回复、在GitHub查看和作者删除。具备仓库写权限的账号可通过系统照片选择器从本机选择最多3张图片并上传为GitHub附件；普通评论权限账号继续支持HTTPS图片链接，并可跳转GitHub完成原生附件上传。",
            "forceUpdate": false
          }
          JSON
          git rm .github/workflows/publish-v1.4.9.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android-native/version.json android-native/v1.4.9
          git commit -m "Publish Android v1.4.9"
          git push
