name: Publish Android v1.5.8

on:
  push:
    paths:
      - ".github/workflows/publish-v1.5.8.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download verified signed artifact
        env:
          ARTIFACT_URL: 'https://sdmntpraustraliaeast.oaiusercontent.com/files/00000000-830c-81fa-bdb9-276f4330bab8/raw?se=2026-10-01T02%3A58%3A35Z&sp=r&sv=2026-02-06&sr=b&scid=9c82ebbb-e4af-5cdc-9175-8538338e351a&skoid=f5e14fda-2af7-44a3-9d18-d372ffcad871&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-01T01%3A43%3A37Z&ske=2026-10-02T01%3A43%3A37Z&sks=b&skv=2026-02-06&sig=gjitsnhwEAUf0VO1ncQ%2BWdEa4x20DZZ4v/oHcdDMaac%3D'
        run: |
          set -euo pipefail
          curl -fL "$ARTIFACT_URL" -o /tmp/v158.zip
          echo "4b3ed016ae8a28e1da50581d1b36f32c439b2942db603e169f964f19482d014d  /tmp/v158.zip" | sha256sum -c -
          mkdir -p /tmp/v158
          unzip -q /tmp/v158.zip -d /tmp/v158
          test -f /tmp/v158/ziwuxilv-native-v1.5.8.apk
          test -f /tmp/v158/ziwuxilv-native-v1.5.8.apk.sha256
          echo "de85b59d146e9228669e1ebd21372e3cb86a7c8267b8390ddbbe33c88bb9ea4d  /tmp/v158/ziwuxilv-native-v1.5.8.apk" | sha256sum -c -
          grep -q '^de85b59d146e9228669e1ebd21372e3cb86a7c8267b8390ddbbe33c88bb9ea4d  ziwuxilv-native-v1.5.8.apk$' /tmp/v158/ziwuxilv-native-v1.5.8.apk.sha256

      - name: Publish v1.5.8
        run: |
          set -euo pipefail
          test ! -e android-native/v1.5.8
          mkdir -p android-native/v1.5.8
          cp /tmp/v158/ziwuxilv-native-v1.5.8.apk android-native/v1.5.8/
          cp /tmp/v158/ziwuxilv-native-v1.5.8.apk.sha256 android-native/v1.5.8/
          cat > android-native/version.json <<'JSON'
          {
            "versionCode": 40,
            "versionName": "1.5.8",
            "downloadUrl": "https://raw.githubusercontent.com/chaonpu/ziwuxilv/main/android-native/v1.5.8/ziwuxilv-native-v1.5.8.apk",
            "updateLog": "v1.5.8正式版：完成行情页与自选/持仓体验重构。全球指数、指数期货、商品和加密资产按品种采用独立数据源与分层回退，修复台湾加权、纳斯达克金龙中国、富时沙特阿拉伯指数以及恒生/恒生科技指数和期货的未读取、异常0%与时间判断问题；新增全球交易所节假日、特殊交易日及长假上一有效收盘保留，避免休市日误判开盘后清空行情。优化行情刷新、延时/滞后状态、当地时间与北京时间展示；完善自选和本机持仓搜索、排序与移动端自适应；增强GitHub登录重试及APP内访问授权/同步权限流程。",
            "forceUpdate": false
          }
          JSON
          git rm .github/workflows/publish-v1.5.8.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android-native/version.json android-native/v1.5.8
          git commit -m "Publish Android v1.5.8"
          git push
