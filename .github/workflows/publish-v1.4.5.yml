name: Publish Android v1.4.5

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v1.4.5.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download signed release artifact
        env:
          ARTIFACT_URL: "https://sdmntprnznorth.oaiusercontent.com/files/00000000-11f8-820b-af0f-7c732eb23507/raw?se=2026-09-28T03%3A20%3A47Z&sp=r&sv=2026-02-06&sr=b&scid=735a8f3f-8bed-5f98-b610-3edae85b3b42&skoid=f5e14fda-2af7-44a3-9d18-d372ffcad871&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-28T01%3A09%3A49Z&ske=2026-09-29T01%3A09%3A49Z&sks=b&skv=2026-02-06&sig=1T1E%2BKHsNwXiKuPqz43uKj9P2Ihk1FdHzwjQSDOo7Mg%3D"
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "$ARTIFACT_URL" -o /tmp/v1.4.5.zip
          rm -rf /tmp/v1.4.5
          mkdir -p /tmp/v1.4.5
          unzip -q /tmp/v1.4.5.zip -d /tmp/v1.4.5
          test -s /tmp/v1.4.5/ziwuxilv-native-v1.4.5.apk
          echo "7627e41df0bf343cc6490ba4b22effd741922739ee3c929a2d2537fb248a6650  /tmp/v1.4.5/ziwuxilv-native-v1.4.5.apk" | sha256sum -c -

      - name: Publish APK and update manifest
        run: |
          set -euo pipefail
          mkdir -p android-native/v1.4.5
          cp /tmp/v1.4.5/ziwuxilv-native-v1.4.5.apk android-native/v1.4.5/ziwuxilv-native-v1.4.5.apk
          cp /tmp/v1.4.5/ziwuxilv-native-v1.4.5.apk.sha256 android-native/v1.4.5/ziwuxilv-native-v1.4.5.apk.sha256
          python3 - <<'PY'
          import json
          p = {
            "versionCode": 23,
            "versionName": "1.4.5",
            "downloadUrl": "https://raw.githubusercontent.com/chaonpu/ziwuxilv/main/android-native/v1.4.5/ziwuxilv-native-v1.4.5.apk",
            "updateLog": "校准行情页数据源与字段：恒生指数期货/恒生科技期货改用东方财富主力合约并增加合约回退，主要全球指数优先使用东方财富统一指数口径，修正新浪全球指数、美元指数、离岸人民币和海外期货的昨收/今开/高低字段，并拒绝陈旧行情；源端延时行情在网格显示小型“延时”标记，详情显示行情延时字段。已清仓卡片新增行业/ETF跟踪标的；排行榜重点标记前三与前五；广场优化发布体验并支持回复评论形成 GitHub Discussions 线程。",
            "forceUpdate": False,
          }
          with open("android-native/version.json","w",encoding="utf-8") as f:
              json.dump(p,f,ensure_ascii=False,indent=2)
              f.write("\n")
          PY
          rm -f .github/workflows/publish-v1.4.5.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish Android v1.4.5"
          git push origin HEAD:main
