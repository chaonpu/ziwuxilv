name: Publish Android v1.4.2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v1.4.2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download signed release artifact
        env:
          ARTIFACT_URL: "https://sdmntprwestus.oaiusercontent.com/files/00000000-9398-8230-880e-ba86ee51efcf/raw?se=2026-09-27T18%3A39%3A40Z&sp=r&sv=2026-02-06&sr=b&scid=e10eeb53-ab25-56ed-8f1a-1c2123f24677&skoid=5e713cdb-766b-475e-a3ca-8adb6cf99aa0&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-27T14%3A03%3A50Z&ske=2026-09-28T14%3A03%3A50Z&sks=b&skv=2026-02-06&sig=LNX6osCo%2B9x%2B5dbfslRxFDnZyMazX8G1NNq/zDO5jnI%3D"
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "$ARTIFACT_URL" -o /tmp/v1.4.2.zip
          rm -rf /tmp/v1.4.2
          mkdir -p /tmp/v1.4.2
          unzip -q /tmp/v1.4.2.zip -d /tmp/v1.4.2
          test -s /tmp/v1.4.2/ziwuxilv-native-v1.4.2.apk
          echo "77059d67676c1008aeeff1b34f6f835ac20d94492ec6360808ad391325916ec2  /tmp/v1.4.2/ziwuxilv-native-v1.4.2.apk" | sha256sum -c -

      - name: Publish APK and update manifest
        run: |
          set -euo pipefail
          mkdir -p android-native/v1.4.2
          cp /tmp/v1.4.2/ziwuxilv-native-v1.4.2.apk android-native/v1.4.2/ziwuxilv-native-v1.4.2.apk
          cp /tmp/v1.4.2/ziwuxilv-native-v1.4.2.apk.sha256 android-native/v1.4.2/ziwuxilv-native-v1.4.2.apk.sha256
          python3 -c 'import json; p={"versionCode":20,"versionName":"1.4.2","downloadUrl":"https://raw.githubusercontent.com/chaonpu/ziwuxilv/main/android-native/v1.4.2/ziwuxilv-native-v1.4.2.apk","updateLog":"修复国内网络下加密行情源提示，名称添加持仓与A股行业补全；优化模式选择；广场头像展示GitHub公开资料，支持App投票、原生GitHub投票及本人发布/回复的隐蔽删除；移除跳转GitHub完整讨论入口；修复底部导航返回各页根页面；缩小应用更新操作区。","forceUpdate":False}; open("android-native/version.json","w",encoding="utf-8").write(json.dumps(p,ensure_ascii=False,indent=2)+"\n")'
          rm -f .github/workflows/publish-v1.4.2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish Android v1.4.2"
          git push origin HEAD:main
