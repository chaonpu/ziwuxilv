name: Profile Registry update

on:
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==12.3.0
      - run: python -m unittest discover -s tests -p 'test_profile*.py' -v
  update:
    concurrency:
      group: profile-registry-write
      cancel-in-progress: false
      queue: max
    if: >-
      github.event_name == 'issue_comment' &&
      !github.event.issue.pull_request &&
      startsWith(github.event.comment.body, 'ZIWUXILV_PROFILE_SUBMIT_V1') &&
      github.event.comment.user.id == github.event.issue.user.id
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==12.3.0
      - run: python tools/profile_registry.py
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Preserve committed result or report a typed failure
        if: failure()
        run: python tools/profile_registry.py --report-failure
        env:
          GH_TOKEN: ${{ github.token }}
