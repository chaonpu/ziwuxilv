name: Publish Android v1.4.8

on:
  push:
    paths:
      - ".github/workflows/publish-v1.4.8.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download signed artifact
        env:
          ARTIFACT_URL: "https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-7d78-8211-9e2a-1da472457af7/raw?se=2026-09-28T07%3A40%3A44Z&sp=r&sv=2026-02-06&sr=b&scid=6aa85487-ea3b-5717-b49e-cb632e5853ce&skoid=fb469448-2cc9-41bd-a5a6-6e020952b47a&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-28T06%3A53%3A31Z&ske=2026-09-29T06%3A53%3A31Z&sks=b&skv=2026-02-06&sig=fs0PT0eKsjSyCXthm4I6uRq4w7nyhPLezOXEhcgOazQ%3D"
        run: |
          set -euo pipefail
          curl -fL "$ARTIFACT_URL" -o /tmp/v148.zip
          mkdir -p /tmp/v148
          unzip -q /tmp/v148.zip -d /tmp/v148
          echo "80ae278fdb6d24cde47f684df908a5edbfde4c85b67d4f30e288796d989ef1d7  /tmp/v148/ziwuxilv-native-v1.4.8.apk" | sha256sum -c -
      - name: Publish v1.4.8
        run: |
          set -euo pipefail
          mkdir -p android-native/v1.4.8
          cp /tmp/v148/ziwuxilv-native-v1.4.8.apk android-native/v1.4.8/
          cp /tmp/v148/ziwuxilv-native-v1.4.8.apk.sha256 android-native/v1.4.8/
          cat > android-native/version.json <<'JSON'
          {
            "versionCode": 26,
            "versionName": "1.4.8",
            "downloadUrl": "https://raw.githubusercontent.com/chaonpu/ziwuxilv/main/android-native/v1.4.8/ziwuxilv-native-v1.4.8.apk",
            "updateLog": "行情源完成逐项审计并启用大陆直连白名单：沙特TASI下线并替换为新加坡STI，STI采用富途网页明确的10分钟延时行情；A股与新浪港股实时行情保持实时，恒生指数/恒生科技指数使用新浪港交所授权实时基本行情；恒指期货与恒生科技期货开市期间主动尝试经济通即时网页，恒科期货再以富途明确15分钟延时行情兜底；美股道琼斯、纳斯达克综合、标普500使用腾讯轻量源，缺失或开市中滞后时尝试富途网页，只有行情时间新鲜且页面无延时声明时才认定实时；其他无法证明实时的海外指数、期货和商品继续保守标延时/待核验。全球行情约15秒刷新，仅变化网格错峰轻柔闪烁；延时、滞后、待核验、未读取标记移至卡片顶部且与边框同色。广场发布支持最多3张HTTPS图片随帖子展示；评论回复保持同一线程，可连续对话。",
            "forceUpdate": false
          }
          JSON
          git rm .github/workflows/publish-v1.4.8.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android-native/version.json android-native/v1.4.8
          git commit -m "Publish Android v1.4.8"
          git push
