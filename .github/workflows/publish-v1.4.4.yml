name: Publish Android v1.4.4

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v1.4.4.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download signed release artifact
        env:
          ARTIFACT_URL: "https://sdmntprwestus3.oaiusercontent.com/files/00000000-85c4-81fd-af6e-aa3e852bd10e/raw?se=2026-09-27T21%3A06%3A17Z&sp=r&sv=2026-02-06&sr=b&scid=29ccf04a-8eb7-518d-9adb-b3df94e8cf57&skoid=5e713cdb-766b-475e-a3ca-8adb6cf99aa0&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-27T12%3A31%3A45Z&ske=2026-09-28T12%3A31%3A45Z&sks=b&skv=2026-02-06&sig=c0C8ZvG4FPH5eAHL49B1Xz1sOxva4mYnTvdDd3zWmok%3D"
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "$ARTIFACT_URL" -o /tmp/v1.4.4.zip
          rm -rf /tmp/v1.4.4
          mkdir -p /tmp/v1.4.4
          unzip -q /tmp/v1.4.4.zip -d /tmp/v1.4.4
          test -s /tmp/v1.4.4/ziwuxilv-native-v1.4.4.apk
          echo "4c74ca330173d8f7658138061011f6b7d6d6472d6e1869f39dd5a4e571e6c2de  /tmp/v1.4.4/ziwuxilv-native-v1.4.4.apk" | sha256sum -c -

      - name: Publish APK and update manifest
        run: |
          set -euo pipefail
          mkdir -p android-native/v1.4.4
          cp /tmp/v1.4.4/ziwuxilv-native-v1.4.4.apk android-native/v1.4.4/ziwuxilv-native-v1.4.4.apk
          cp /tmp/v1.4.4/ziwuxilv-native-v1.4.4.apk.sha256 android-native/v1.4.4/ziwuxilv-native-v1.4.4.apk.sha256
          python3 -c 'import json; p={"versionCode":22,"versionName":"1.4.4","downloadUrl":"https://raw.githubusercontent.com/chaonpu/ziwuxilv/main/android-native/v1.4.4/ziwuxilv-native-v1.4.4.apk","updateLog":"统一行情时间与详情字段格式，全球指数新增纳斯达克金龙中国指数；收益页四个核心数据居中并优化排版，修复切换时间段后曲线游标失效，收益浮窗默认显示当前净值与所选区间阶段累计收益并随游标联动；排行榜“单标的”改为“股票”；重做广场、收益日历、排行榜等下拉选择器与箭头，统一标签页、卡片圆角、边框和留白，整体优化 App UI。","forceUpdate":False}; open("android-native/version.json","w",encoding="utf-8").write(json.dumps(p,ensure_ascii=False,indent=2)+"\n")'
          rm -f .github/workflows/publish-v1.4.4.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish Android v1.4.4"
          git push origin HEAD:main
