name: One-shot SGX broker table diagnostic
on:
  push:
    branches: [main]
    paths: ['.github/workflows/sgx-broker-source-diagnostics.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Inspect bounded broker holiday evidence, no state writes
        run: |
          PYTHONPATH=tools python3 - <<'PY'
          from calendar_sync import Page,source_get,source_text
          import re,json
          url='https://www.poems.com.sg/markets/sgx/'
          data=source_get(url)
          obj=Page(source_text(data,url))
          p=' '.join(obj.plain().split())
          pairs=[('16','February'),('24','December'),('31','December')]
          print('SG_BROKER '+json.dumps({
              'length':len(p),'page2026':'Holiday 2026' in p,
              'partial':p.count('Partial'),
              'checks':{day+month:bool(re.search(r'(?<!\d)'+day+r'\s+'+month+r'\b',p))
                 for day,month in pairs},
              'contexts':{day+month:[p[max(0,m.start()-50):m.end()+75] for m in list(re.finditer(day+r'\s*'+month,p))[:3]] for day,month in pairs},
              'rowExamples':[row for row in obj.rows if any(day+' '+month in str(row) for day,month in pairs)][:4]
          },ensure_ascii=False))
          PY
