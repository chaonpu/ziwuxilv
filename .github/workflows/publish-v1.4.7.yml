name: Publish Android v1.4.7

on:
  push:
    paths:
      - ".github/workflows/publish-v1.4.7.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download signed artifact
        env:
          ARTIFACT_URL: "https://sdmntprnznorth.oaiusercontent.com/files/00000000-c6b8-820b-8f6d-c46dcc13adcc/raw?se=2026-09-28T05%3A57%3A51Z&sp=r&sv=2026-02-06&sr=b&scid=b783b4f7-5408-52ae-ad0f-b62ae48719ba&skoid=f5e14fda-2af7-44a3-9d18-d372ffcad871&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-28T05%3A04%3A42Z&ske=2026-09-29T05%3A04%3A42Z&sks=b&skv=2026-02-06&sig=Hlvq3iOjWjt8GcyPPl4NGLItHAdcmVs9rwXbsf2jHNc%3D"
        run: |
          set -euo pipefail
          curl -fL "$ARTIFACT_URL" -o /tmp/v147.zip
          mkdir -p /tmp/v147
          unzip -q /tmp/v147.zip -d /tmp/v147
          echo "85c81194bad473c60eb07f243e0c62037cdd0bb1d32e0bfe5eea892ebdb33859  /tmp/v147/ziwuxilv-native-v1.4.7.apk" | sha256sum -c -
      - name: Publish v1.4.7
        run: |
          set -euo pipefail
          mkdir -p android-native/v1.4.7
          cp /tmp/v147/ziwuxilv-native-v1.4.7.apk android-native/v1.4.7/
          cp /tmp/v147/ziwuxilv-native-v1.4.7.apk.sha256 android-native/v1.4.7/
          cat > android-native/version.json <<'JSON'
          {
            "versionCode": 25,
            "versionName": "1.4.7",
            "downloadUrl": "https://raw.githubusercontent.com/chaonpu/ziwuxilv/main/android-native/v1.4.7/ziwuxilv-native-v1.4.7.apk",
            "updateLog": "修复沙特TASI与恒生科技期货行情：沙特使用Saudi Exchange官方延时行情并按实际报价时间计算延时，恒生科技期货优先使用经济通即时行情、富途延时行情兜底；恒生指数与恒生科技指数切换为新浪实时港股指数。修正沙特周日至周四交易时段、港股期货17:00夜盘，以及A股/美股盘前、盘中、盘后、休市边界并增加测试。行情自动刷新不再显示转圈，仅手动刷新显示；价格变化时格子轻微闪烁，延时标记紧贴价格并显示分钟数。行情页边框：盘前和午间休息金色，盘中涨红跌绿平灰，其他灰色。手动持仓卡压缩排版并强化价格/涨跌幅；广场发布改为右下角悬浮图标；收益页和排行榜精简冗余说明；排行榜前三名增加冠亚季军标识。",
            "forceUpdate": false
          }
          JSON
          git rm .github/workflows/publish-v1.4.7.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android-native/version.json android-native/v1.4.7
          git commit -m "Publish Android v1.4.7"
          git push
