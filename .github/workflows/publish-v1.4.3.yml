name: Publish Android v1.4.3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v1.4.3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download signed release artifact
        env:
          ARTIFACT_URL: "https://sdmntprwestus3.oaiusercontent.com/files/00000000-eb0c-81fd-a484-a6a03ccc6830/raw?se=2026-09-27T19%3A49%3A35Z&sp=r&sv=2026-02-06&sr=b&scid=78cfa048-7bce-52dd-ad2b-c81b528fe162&skoid=5e713cdb-766b-475e-a3ca-8adb6cf99aa0&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-27T17%3A42%3A47Z&ske=2026-09-28T17%3A42%3A47Z&sks=b&skv=2026-02-06&sig=WfTpSsOosIVUAOrNfGYmfLQBzc3FWz1LUF7/%2BXwWSNY%3D"
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "$ARTIFACT_URL" -o /tmp/v1.4.3.zip
          rm -rf /tmp/v1.4.3
          mkdir -p /tmp/v1.4.3
          unzip -q /tmp/v1.4.3.zip -d /tmp/v1.4.3
          test -s /tmp/v1.4.3/ziwuxilv-native-v1.4.3.apk
          echo "9d8cdaabbb6b0f9a133d35d5d0816c94d986121b83c179f39774b9c4378bcce6  /tmp/v1.4.3/ziwuxilv-native-v1.4.3.apk" | sha256sum -c -

      - name: Publish APK and update manifest
        run: |
          set -euo pipefail
          mkdir -p android-native/v1.4.3
          cp /tmp/v1.4.3/ziwuxilv-native-v1.4.3.apk android-native/v1.4.3/ziwuxilv-native-v1.4.3.apk
          cp /tmp/v1.4.3/ziwuxilv-native-v1.4.3.apk.sha256 android-native/v1.4.3/ziwuxilv-native-v1.4.3.apk.sha256
          python3 -c 'import json; p={"versionCode":21,"versionName":"1.4.3","downloadUrl":"https://raw.githubusercontent.com/chaonpu/ziwuxilv/main/android-native/v1.4.3/ziwuxilv-native-v1.4.3.apk","updateLog":"修复广场 App 自建投票识别与投票；全球行情移除国内不可用的 Yahoo/Kraken/CoinGecko 运行时依赖，KOSPI、SENSEX、TASI、IBOV、道指/日经/纳指期货、美元指数、离岸人民币及 BTC/ETH/SOL 改用新浪财经，暂移除无稳定国内免费源的富时亚太；配置模式 A 股行业改用新浪申万行业页面，ETF 跟踪标的改用天天基金国内页面；下拉刷新会重新补全既有持仓的待补充元数据。","forceUpdate":False}; open("android-native/version.json","w",encoding="utf-8").write(json.dumps(p,ensure_ascii=False,indent=2)+"\n")'
          rm -f .github/workflows/publish-v1.4.3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish Android v1.4.3"
          git push origin HEAD:main
