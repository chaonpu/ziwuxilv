name: Publish Android v1.4.6

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v1.4.6.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download signed release artifact
        env:
          ARTIFACT_URL: "https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-ce98-8211-9f17-109e67b48b17/raw?se=2026-09-28T04%3A28%3A15Z&sp=r&sv=2026-02-06&sr=b&scid=5663b753-13cd-5750-b987-229b5224c9c0&skoid=fb469448-2cc9-41bd-a5a6-6e020952b47a&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-27T23%3A55%3A45Z&ske=2026-09-28T23%3A55%3A45Z&sks=b&skv=2026-02-06&sig=a%2BglPYXwYWEQWugWLxWnpgr6Ay0YXCUSDta7ou7KUig%3D"
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "$ARTIFACT_URL" -o /tmp/v1.4.6.zip
          rm -rf /tmp/v1.4.6
          mkdir -p /tmp/v1.4.6
          unzip -q /tmp/v1.4.6.zip -d /tmp/v1.4.6
          test -s /tmp/v1.4.6/ziwuxilv-native-v1.4.6.apk
          echo "8779de229472cd4794f9ed3d44b55bcaa3cd9d0f26c101a1a04bf810bc32a212  /tmp/v1.4.6/ziwuxilv-native-v1.4.6.apk" | sha256sum -c -

      - name: Publish APK and update manifest
        run: |
          set -euo pipefail
          mkdir -p android-native/v1.4.6
          cp /tmp/v1.4.6/ziwuxilv-native-v1.4.6.apk android-native/v1.4.6/ziwuxilv-native-v1.4.6.apk
          cp /tmp/v1.4.6/ziwuxilv-native-v1.4.6.apk.sha256 android-native/v1.4.6/ziwuxilv-native-v1.4.6.apk.sha256
          python3 - <<'PY'
          import json
          p = {
            "versionCode": 24,
            "versionName": "1.4.6",
            "downloadUrl": "https://raw.githubusercontent.com/chaonpu/ziwuxilv/main/android-native/v1.4.6/ziwuxilv-native-v1.4.6.apk",
            "updateLog": "行情源改为国内直连优先：全球指数与海外行情不再依赖东方财富，优先使用腾讯财经/新浪财经，并修正纳斯达克综合指数口径；恒生科技期货改为自动探测当月/次月新浪合约，减少“待读取”。修复行情卡片边框状态，统一为开市绿、盘前/午休/交易间歇黄、收市灰，并修复“延时”标记被裁切。收益页新增基于实时持仓报价的展示层盘中净值与收益估值，不改写已核实账本；已清仓默认仅展开本月，本月无记录时展开最近一个有记录月份。",
            "forceUpdate": False,
          }
          with open("android-native/version.json","w",encoding="utf-8") as f:
              json.dump(p,f,ensure_ascii=False,indent=2)
              f.write("\n")
          PY
          rm -f .github/workflows/publish-v1.4.6.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish Android v1.4.6"
          git push origin HEAD:main
