name: Publish Android v1.5.1

on:
  push:
    paths:
      - ".github/workflows/publish-v1.5.1.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download signed artifact
        env:
          ARTIFACT_URL: 'https://sdmntprwestus3.oaiusercontent.com/files/00000000-84bc-81fd-80ee-a90a64160302/raw?se=2026-09-28T13%3A06%3A01Z&sp=r&sv=2026-02-06&sr=b&scid=28a6290a-3b42-5357-97cc-ee383e9abd2a&skoid=5e713cdb-766b-475e-a3ca-8adb6cf99aa0&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-28T01%3A43%3A51Z&ske=2026-09-29T01%3A43%3A51Z&sks=b&skv=2026-02-06&sig=C/GcVAqyrd8PMv2oF0rBPvTkFVRC5PwtMZJdqJ09QkU%3D'
        run: |
          set -euo pipefail
          curl -fL "$ARTIFACT_URL" -o /tmp/v151.zip
          mkdir -p /tmp/v151
          unzip -q /tmp/v151.zip -d /tmp/v151
          cd /tmp/v151
          sha256sum -c ziwuxilv-native-v1.5.1.apk.sha256
      - name: Publish v1.5.1
        run: |
          set -euo pipefail
          mkdir -p android-native/v1.5.1
          cp /tmp/v151/ziwuxilv-native-v1.5.1.apk android-native/v1.5.1/
          cp /tmp/v151/ziwuxilv-native-v1.5.1.apk.sha256 android-native/v1.5.1/
          cat > android-native/version.json <<'JSON'
          {
            "versionCode": 33,
            "versionName": "1.5.1",
            "downloadUrl": "https://raw.githubusercontent.com/chaonpu/ziwuxilv/main/android-native/v1.5.1/ziwuxilv-native-v1.5.1.apk",
            "updateLog": "修复台湾加权与加密货币行情：台湾加权改用新浪稳定的znb_TWSE作为主行情，继续尝试b_TWSE补充OHLC，不再回退为腾讯主显示；同时修正新浪全球指数交易时段识别。新浪行情请求增加rn时间戳与强制禁缓存，并将BTC/ETH/SOL拆为独立批次刷新；若新浪加密行情缺失或超过2分钟未更新，自动回退Kraken公开行情，避免价格长时间冻结。广场所有“删除”相关文字统一使用独立危险红色，不再复用行情下跌的绿色。",
            "forceUpdate": false
          }
          JSON
          git rm .github/workflows/publish-v1.5.1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android-native/version.json android-native/v1.5.1
          git commit -m "Publish Android v1.5.1"
          git push
