name: Publish Android v1.4.10

on:
  push:
    paths:
      - ".github/workflows/publish-v1.4.10.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download signed artifact
        env:
          ARTIFACT_URL: "https://sdmntprwestus3.oaiusercontent.com/files/00000000-fe84-81fd-bea3-02789e1c5170/raw?se=2026-09-28T10%3A35%3A42Z&sp=r&sv=2026-02-06&sr=b&scid=3dc4ed0b-fa38-5c7e-95ce-4165f4387bbc&skoid=f5e14fda-2af7-44a3-9d18-d372ffcad871&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-28T05%3A58%3A03Z&ske=2026-09-29T05%3A58%3A03Z&sks=b&skv=2026-02-06&sig=/u%2BuEWv3h7da6ieqUBx6E/04SuY4slrv0nZglRnNma4%3D"
        run: |
          set -euo pipefail
          curl -fL "$ARTIFACT_URL" -o /tmp/v1410.zip
          mkdir -p /tmp/v1410
          unzip -q /tmp/v1410.zip -d /tmp/v1410
          echo "e426f5c7e3920c9b3d2b2f8f0801110810660638c6a9bfdf67be7688622378e7  /tmp/v1410/ziwuxilv-native-v1.4.10.apk" | sha256sum -c -
      - name: Publish v1.4.10
        run: |
          set -euo pipefail
          mkdir -p android-native/v1.4.10
          cp /tmp/v1410/ziwuxilv-native-v1.4.10.apk android-native/v1.4.10/
          cp /tmp/v1410/ziwuxilv-native-v1.4.10.apk.sha256 android-native/v1.4.10/
          cat > android-native/version.json <<'JSON'
          {
            "versionCode": 28,
            "versionName": "1.4.10",
            "downloadUrl": "https://raw.githubusercontent.com/chaonpu/ziwuxilv/main/android-native/v1.4.10/ziwuxilv-native-v1.4.10.apk",
            "updateLog": "行情时效标签继续核验：已确认“数据源本身延时”但无法得到精确分钟数的品种不再误标为“待核验”，改为“延时”；新浪环球指数与部分国际期货按公开说明显示“延时≥15分”，富途新加坡STI仍优先读取页面明确的“延时10分”。只有源属性确实无法确认时才显示“待核验”，无行情显示“未读取”，实时源时间异常继续显示“滞后N分”。广场取消App内本机图片选择和图片链接输入，发布与回复均增加“通过GitHub上传图片>>”，点击跳转GitHub使用原生附件上传，GitHub中的图片仍可在广场正常展示。",
            "forceUpdate": false
          }
          JSON
          git rm .github/workflows/publish-v1.4.10.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android-native/version.json android-native/v1.4.10
          git commit -m "Publish Android v1.4.10"
          git push
