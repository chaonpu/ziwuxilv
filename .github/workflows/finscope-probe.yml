name: FinScope probe
on:
  pull_request:
    paths:
      - ".github/workflows/finscope-probe.yml"
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Probe FinScope coverage
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request, time
          from concurrent.futures import ThreadPoolExecutor, as_completed

          BASE="https://finance.pae.baidu.com"
          H={"User-Agent":"Mozilla/5.0","Accept":"application/json","Referer":"https://finance.baidu.com/"}
          TARGETS=[
            ("日经225",["日经225","Nikkei 225","N225"]),
            ("富时100",["富时100","FTSE 100","UKX"]),
            ("DAX",["DAX","德国DAX"]),
            ("SENSEX",["SENSEX","孟买SENSEX"]),
            ("CAC40",["CAC40","CAC 40"]),
            ("富时沙特",["富时沙特","FTSE Saudi Arabia","Saudi Arabia"]),
            ("IBOVESPA",["IBOVESPA","Bovespa","巴西IBOVESPA"]),
            ("金龙中国HXC",["纳斯达克金龙中国","HXC","Golden Dragon China"]),
            ("道指期货YM",["道指期货","YM","E-mini Dow"]),
            ("纳指期货NQ",["纳指期货","NQ","E-mini Nasdaq"]),
            ("标普期货ES",["标普期货","ES","E-mini S&P 500"]),
          ]

          def req(path,params=None):
            u=BASE+path
            if params: u+="?"+urllib.parse.urlencode(params)
            t=time.time()
            try:
              rq=urllib.request.Request(u,headers=H)
              with urllib.request.urlopen(rq,timeout=5) as r:
                raw=r.read().decode("utf-8","replace")
              try: j=json.loads(raw)
              except Exception: j={"_raw":raw[:2000]}
              return {"ok":1,"status":r.status,"ms":round((time.time()-t)*1000),"url":u,"j":j}
            except Exception as e:
              return {"ok":0,"ms":round((time.time()-t)*1000),"url":u,"err":type(e).__name__+":"+str(e)[:300]}

          def js(x): return json.dumps(x,ensure_ascii=False,separators=(",",":"))
          def walk(x):
            if isinstance(x,dict):
              yield x
              for v in x.values(): yield from walk(v)
            elif isinstance(x,list):
              for v in x: yield from walk(v)

          print("=== BASICS ===")
          jobs=[]
          for area in ["all","asia","america","europeafrica","other"]:
            jobs.append(("GLOBAL:"+area,"/vapi/v1/globalindexrank",{"pn":0,"rn":500,"area":area}))
          jobs += [
            ("FUTURES:overview","/vapi/v1/futuresoverview",None),
            ("FUTURES:list","/vapi/v1/getfutureslist",{"pn":0,"rn":500}),
          ]
          broad={}
          with ThreadPoolExecutor(max_workers=8) as ex:
            futs={ex.submit(req,p,pa):(n,p,pa) for n,p,pa in jobs}
            for f in as_completed(futs):
              n,_,_=futs[f]; r=f.result(); broad[n]=r
              j=r.get("j",{})
              print(n,"ok",r["ok"],"status",r.get("status"),"ms",r["ms"],"rc",j.get("ResultCode"),"msg",j.get("ResultMsg"),"len",len(js(j)))

          print("\n=== SUGGESTIONS ===")
          sug={}
          sjobs=[(label,wd) for label,keys in TARGETS for wd in keys]
          with ThreadPoolExecutor(max_workers=16) as ex:
            futs={ex.submit(req,"/vapi/v1/sug",{"wd":wd,"finClientType":"pc"}):(label,wd) for label,wd in sjobs}
            for f in as_completed(futs):
              label,wd=futs[f]; r=f.result(); sug[(label,wd)]=r
              j=r.get("j",{})
              result=j.get("Result")
              print("SUG",label,repr(wd),"ok",r["ok"],"status",r.get("status"),"ms",r["ms"],"rc",j.get("ResultCode"),"RESULT",js(result)[:2500] if result is not None else None)

          print("\n=== BROAD MATCHES ===")
          for label,keys in TARGETS:
            print("TARGET",label)
            lows=[k.lower() for k in keys]
            hit=0
            for src,r in broad.items():
              if not r.get("ok"): continue
              for d in walk(r.get("j",{}).get("Result",{})):
                if not isinstance(d,dict): continue
                t=js(d).lower()
                if any(k in t for k in lows):
                  print("MATCH",src,js(d)[:2500]); hit+=1
                  if hit>=12: break
              if hit>=12: break
            if not hit: print("MATCH none")

          print("\n=== CANDIDATE QUOTES ===")
          quote_jobs=[]
          for label,keys in TARGETS:
            rows=[]
            for wd in keys:
              r=sug.get((label,wd),{})
              if not r.get("ok"): continue
              for d in walk(r.get("j",{}).get("Result",{})):
                if not isinstance(d,dict): continue
                # candidate must look security-like
                code=next((str(d.get(k)) for k in ["code","symbol","stockCode","secuCode","indexCode"] if d.get(k) not in [None,""]),None)
                if not code: continue
                name=next((str(d.get(k)) for k in ["name","stockName","secuName","title"] if d.get(k) not in [None,""]),"")
                market=next((str(d.get(k)) for k in ["market","marketType","market_type"] if d.get(k) not in [None,""]),None)
                ft=next((str(d.get(k)) for k in ["financeType","finance_type","type"] if d.get(k) not in [None,""]),None)
                tup=(code,market,ft,name)
                if tup not in rows: rows.append(tup)
            print("CANDIDATES",label,rows[:12])
            for code,market,ft,name in rows[:4]:
              isf="期货" in label
              mk=market or ("us" if isf else "global")
              ftype=ft or ("futures" if isf else "index")
              groups=(["quotation_futures_minute","quotation_minute_us","quotation_minute_global"] if isf
                      else ["quotation_index_minute","quotation_minute_global",f"quotation_minute_{mk}"])
              for g in dict.fromkeys(groups):
                params={"code":code,"query":code,"market_type":mk,"financeType":ftype,
                        "group":g,"pointType":"string","new_Format":1,"finClientType":"pc"}
                quote_jobs.append((label,code,mk,ftype,name,g,params))
          with ThreadPoolExecutor(max_workers=16) as ex:
            futs={ex.submit(req,"/vapi/v1/getquotation",x[-1]):x for x in quote_jobs}
            for f in as_completed(futs):
              label,code,mk,ftype,name,g,_=futs[f]; r=f.result(); j=r.get("j",{})
              R=j.get("Result")
              cur=R.get("cur") if isinstance(R,dict) else None
              print("QUOTE",label,code,mk,ftype,g,"ok",r["ok"],"status",r.get("status"),"ms",r["ms"],"rc",j.get("ResultCode"),"cur",js(cur)[:1000] if cur else None)

          print("=== END ===")
          PY
