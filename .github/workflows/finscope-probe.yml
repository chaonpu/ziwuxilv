name: FinScope probe
on:
  pull_request:
    paths:
      - ".github/workflows/finscope-probe.yml"
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe FinScope selected instruments
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request, time
          from concurrent.futures import ThreadPoolExecutor, as_completed
          BASE="https://finance.pae.baidu.com"
          H={"User-Agent":"Mozilla/5.0","Accept":"application/json","Referer":"https://finance.baidu.com/"}
          def get(path,params=None,timeout=6):
            u=BASE+path
            if params: u+="?"+urllib.parse.urlencode(params)
            t=time.time()
            try:
              q=urllib.request.Request(u,headers=H)
              with urllib.request.urlopen(q,timeout=timeout) as r:
                raw=r.read().decode("utf-8","replace")
              j=json.loads(raw)
              return {"ok":1,"status":r.status,"ms":round((time.time()-t)*1000),"j":j}
            except Exception as e:
              return {"ok":0,"ms":round((time.time()-t)*1000),"err":type(e).__name__+":"+str(e)}
          def js(x): return json.dumps(x,ensure_ascii=False,separators=(",",":"))
          def walk(x):
            if isinstance(x,dict):
              yield x
              for v in x.values(): yield from walk(v)
            elif isinstance(x,list):
              for v in x: yield from walk(v)
          def global_rows():
            out=[]
            with ThreadPoolExecutor(max_workers=5) as ex:
              futs={ex.submit(get,"/vapi/v1/globalindexrank",{"pn":0,"rn":500,"area":a}):a for a in ["all","asia","america","europeafrica","other"]}
              for f in as_completed(futs):
                a=futs[f]; r=f.result()
                print("GLOBAL_REQ",a,"ok",r["ok"],"ms",r["ms"],"rc",r.get("j",{}).get("ResultCode"),"err",r.get("err"))
                if not r["ok"]: continue
                for d in walk(r["j"].get("Result",{})):
                  if isinstance(d,dict) and d.get("code") and d.get("name") and ("last_px" in d or d.get("subType") in ["globalIndex","index"]):
                    sig=(d.get("code"),d.get("market"),d.get("name"))
                    if not any((x.get("code"),x.get("market"),x.get("name"))==sig for x in out): out.append(d)
            return out

          wanted={
            "日经225":("NK225","jp"),"富时100":("FTSE","uk"),"DAX":("DAX","de"),
            "SENSEX":("SENSEX","in"),"CAC40":("CAC","fr"),
            "富时沙特":("FISAULM.LOC-FTX","sa"),"HXC":("HXC","us")
          }
          print("=== SNAPSHOT 1 ===")
          rows1=global_rows()
          for label,(code,mkt) in wanted.items():
            xs=[x for x in rows1 if x.get("code")==code and x.get("market")==mkt]
            print("INDEX",label,js(xs[:3]))
          print("BRAZIL_ROWS",js([x for x in rows1 if x.get("market")=="br" or "巴西" in str(x.get("name",""))][:50]))

          print("=== SUG TARGETS ===")
          terms=["IBOVESPA","BOVESPA","BVSP","巴西指数","巴西BOVESPA","HXC",
                 "道指期货","小型道指期货","YM","YM00",
                 "纳指期货","纳斯达克100期货","NQ","NQ00",
                 "标普500期货","标普期货","ES","ES00"]
          with ThreadPoolExecutor(max_workers=12) as ex:
            futs={ex.submit(get,"/vapi/v1/sug",{"wd":t,"finClientType":"pc"}):t for t in terms}
            for f in as_completed(futs):
              t=futs[f]; r=f.result(); print("SUG",repr(t),"ok",r["ok"],"ms",r["ms"],"rc",r.get("j",{}).get("ResultCode"),"RESULT",js(r.get("j",{}).get("Result"))[:3500] if r["ok"] else r.get("err"))

          print("=== STOCKSHORT ===")
          probes=[
            ("NK225","jp"),("FTSE","uk"),("DAX","de"),("SENSEX","in"),("CAC","fr"),
            ("FISAULM.LOC-FTX","sa"),("FISAULMU.USD-FTX","sa"),("HXC","us"),
            ("IBOVESPA","br"),("BVSP","br"),("IBOV","br"),("BOVESPA","br"),
            ("YM","us"),("NQ","us"),("ES","us"),("YM","global"),("NQ","global"),("ES","global")
          ]
          with ThreadPoolExecutor(max_workers=12) as ex:
            futs={ex.submit(get,"/vapi/stockshort",{"code":c,"market":m}):(c,m) for c,m in probes}
            for f in as_completed(futs):
              c,m=futs[f]; r=f.result()
              print("SHORT",c,m,"ok",r["ok"],"ms",r["ms"],"rc",r.get("j",{}).get("ResultCode"),"RESULT",js(r.get("j",{}).get("Result"))[:2000] if r["ok"] else r.get("err"))

          print("=== FUTURES ENDPOINTS ===")
          for p,pa in [("/vapi/v1/futuresoverview",None),("/vapi/v1/getfutureslist",{"pn":0,"rn":500})]:
            r=get(p,pa); print("FUTURES",p,"ok",r["ok"],"ms",r["ms"],"rc",r.get("j",{}).get("ResultCode"),"FULL",js(r.get("j",{}))[:5000] if r["ok"] else r.get("err"))

          print("=== SNAPSHOT 2 AFTER 12S ===")
          time.sleep(12)
          rows2=global_rows()
          for label,(code,mkt) in wanted.items():
            a=next((x for x in rows1 if x.get("code")==code and x.get("market")==mkt),None)
            b=next((x for x in rows2 if x.get("code")==code and x.get("market")==mkt),None)
            print("DELTA",label,"A",js(a),"B",js(b),"CHANGED", bool(a and b and (a.get("last_px")!=b.get("last_px") or a.get("px_change")!=b.get("px_change"))))
          print("=== END ===")
          PY
