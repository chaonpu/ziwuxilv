name: Runner cross-repository dispatch canary (no business operations)

on:
  workflow_dispatch:
    inputs:
      dispatch_id:
        description: "Public coordinator no-op task ID"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: coordinator-canary-${{ inputs.dispatch_id }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Validate coordinator test identity without business side effects
        shell: bash
        env:
          DISPATCH_ID: ${{ inputs.dispatch_id }}
        run: |
          set -euo pipefail
          [[ "$DISPATCH_ID" =~ ^runner-canary-[0-9]{8,20}-publish$ ]] || exit 1
          echo 'Public release repository canary: no APK, release or private repository access.'
