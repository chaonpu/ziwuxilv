name: Publish Android v1.4.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v1.4.0.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download signed release artifact
        env:
          ARTIFACT_URL: "https://sdmntprwestus.oaiusercontent.com/files/00000000-aa74-8230-b989-9d3eb837e8f1/raw?se=2026-09-27T16%3A22%3A40Z&sp=r&sv=2026-02-06&sr=b&scid=6dc23e58-c050-57c0-a61c-a1094cbbb89a&skoid=5e713cdb-766b-475e-a3ca-8adb6cf99aa0&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-27T12%3A04%3A25Z&ske=2026-09-28T12%3A04%3A25Z&sks=b&skv=2026-02-06&sig=r5K9u9WshzGvG2wJo4G%2BmpqFL9Zck3kLBVJavqSt8J4%3D"
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "$ARTIFACT_URL" -o /tmp/v1.4.0.zip
          rm -rf /tmp/v1.4.0
          mkdir -p /tmp/v1.4.0
          unzip -q /tmp/v1.4.0.zip -d /tmp/v1.4.0
          test -s /tmp/v1.4.0/ziwuxilv-native-v1.4.0.apk
          echo "131f6102b34e0ac42c91dab2473f79cbb5220e70c8140444b38d912540dcd858  /tmp/v1.4.0/ziwuxilv-native-v1.4.0.apk" | sha256sum -c -

      - name: Publish APK and update manifest
        run: |
          set -euo pipefail
          mkdir -p android-native/v1.4.0
          cp /tmp/v1.4.0/ziwuxilv-native-v1.4.0.apk android-native/v1.4.0/ziwuxilv-native-v1.4.0.apk
          cp /tmp/v1.4.0/ziwuxilv-native-v1.4.0.apk.sha256 android-native/v1.4.0/ziwuxilv-native-v1.4.0.apk.sha256
          python3 -c 'import json; p={"versionCode":18,"versionName":"1.4.0","downloadUrl":"https://raw.githubusercontent.com/chaonpu/ziwuxilv/main/android-native/v1.4.0/ziwuxilv-native-v1.4.0.apk","updateLog":"优化行情、持仓、广场、收益与排行榜：新增全球行情解析和详情弹窗，支持按名称添加持仓并补全行业/ETF跟踪标的，广场重做作者与发布交互，收益曲线增加坐标与游标，已清仓支持持股天数和按月折叠。","forceUpdate":False}; open("android-native/version.json","w",encoding="utf-8").write(json.dumps(p,ensure_ascii=False,indent=2)+"\n")'
          rm -f .github/workflows/publish-v1.4.0.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish Android v1.4.0"
          git push origin HEAD:main
