name: Actions storage cleanup

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview cleanup without deleting artifacts"
        type: boolean
        default: false
  schedule:
    # Sunday 04:25 Asia/Shanghai (Saturday UTC below).
    - cron: "25 20 * * 6"

permissions:
  actions: write
  contents: read

concurrency:
  group: actions-storage-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Keep recent build artifacts and protect release handoffs
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const now = Date.now();
            const hour = 3600000;
            const pinned = new Set();
            const protectedRuns = new Set();
            for (const path of ['release/latest-handoff.json', 'release/latest-signed.json', 'release/latest-run.json']) {
              try {
                const {data} = await github.rest.repos.getContent({owner, repo, path, ref: context.payload.repository.default_branch});
                const meta = JSON.parse(Buffer.from(data.content, 'base64').toString('utf8'));
                if (Number.isSafeInteger(meta.artifactId)) pinned.add(meta.artifactId);
                if (Number.isSafeInteger(meta.runId)) protectedRuns.add(meta.runId);
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }
            function policy(artifact) {
              const name = artifact.name;
              if (name.startsWith('release-source-')) return {group: 'release-source', keep: 3, grace: 24 * hour};
              if (name.startsWith('ziwu-xilv-') && name.endsWith('-signed')) return {group: 'signed-apk', keep: 3, grace: 2 * hour};
              if (name === 'ziwu-xilv-preview') return {group: 'preview-apk', keep: 3, grace: 2 * hour};
              if (name.endsWith('-smoke-results') || /^verification-v/.test(name)) return {group: name, grace: 72 * hour, maxAge: 72 * hour, ageOnly: true};
              return {group: name, keep: 3, grace: 2 * hour, maxAge: 14 * 24 * hour, ageOnly: true};
            }
            function selectArtifacts(artifacts) {
              const sorted = artifacts.filter(a => !a.expired).sort((a, b) =>
                Date.parse(b.created_at) - Date.parse(a.created_at) || b.id - a.id);
              const counts = new Map();
              const result = [];
              for (const artifact of sorted) {
                const p = policy(artifact);
                const rank = (counts.get(p.group) || 0) + 1;
                counts.set(p.group, rank);
                const age = now - Date.parse(artifact.created_at);
                const protectedArtifact = pinned.has(artifact.id) || protectedRuns.has(artifact.workflow_run?.id);
                const excess = !p.ageOnly && rank > p.keep;
                const old = p.maxAge !== undefined && age > p.maxAge;
                if (!protectedArtifact && age >= p.grace && (excess || old)) result.push(artifact);
              }
              return result;
            }
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {owner, repo, per_page: 100});
            const candidates = selectArtifacts(artifacts);
            const dryRun = context.eventName === 'workflow_dispatch' && context.payload.inputs?.dry_run === 'true';
            const runs = new Map();
            let deleted = 0;
            let bytes = 0;
            let busy = 0;
            for (const artifact of candidates) {
              const runId = artifact.workflow_run?.id;
              if (!runId) { busy++; continue; }
              if (!runs.has(runId)) {
                try {
                  const {data} = await github.rest.actions.getWorkflowRun({owner, repo, run_id: runId});
                  runs.set(runId, data.status);
                } catch (error) {
                  if (error.status !== 404) throw error;
                  runs.set(runId, 'missing');
                }
              }
              if (runs.get(runId) !== 'completed') { busy++; continue; }
              core.info((dryRun ? 'Would delete ' : 'Delete ') + artifact.id + ' | ' + artifact.name + ' | ' + artifact.size_in_bytes + ' bytes');
              if (!dryRun) {
                try {
                  await github.rest.actions.deleteArtifact({owner, repo, artifact_id: artifact.id});
                } catch (error) {
                  if (error.status !== 404) throw error;
                }
              }
              deleted++;
              bytes += artifact.size_in_bytes;
            }
            await core.summary
              .addHeading('Actions storage cleanup')
              .addTable([
                [{data: 'Item', header: true}, {data: 'Value', header: true}],
                ['Artifacts scanned', String(artifacts.length)],
                [dryRun ? 'Artifacts eligible' : 'Artifacts deleted', String(deleted)],
                [dryRun ? 'Space eligible (MiB)' : 'Space released (MiB)', (bytes / 1048576).toFixed(2)],
                ['Unfinished or missing runs skipped', String(busy)],
                ['Pinned artifact IDs', Array.from(pinned).join(', ') || 'None'],
                ['Policy', 'Keep 3 preview APKs, 3 signed APKs, 3 source handoffs; reports 3 days; other artifacts 14 days'],
                ['Preserved', 'Source files, ledgers, discussions, images, and Release assets']
              ]).write();
