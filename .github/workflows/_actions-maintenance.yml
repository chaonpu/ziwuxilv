name: Shared Actions maintenance
'on':
  workflow_call:
    inputs:
      dry_run:
        type: boolean
        default: true
      implementation_ref:
        type: string
        required: true
permissions:
  actions: write
  contents: read
jobs:
  maintenance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
      with:
        repository: chaonpu/ziwuxilv
        ref: ${{ inputs.implementation_ref }}
        persist-credentials: false
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Plan or apply repository-scoped cleanup
      env:
        GH_TOKEN: ${{ github.token }}
        DRY_RUN: ${{ inputs.dry_run }}
      run: |
        args=()
        if [ "$DRY_RUN" = "false" ]; then args+=(--apply); fi
        python tools/actions_maintenance.py "${args[@]}"
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: maintenance-plan
        path: maintenance-result.json
        if-no-files-found: ignore
        retention-days: 7
