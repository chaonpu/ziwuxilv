name: Publish Android v1.4.12

on:
  push:
    paths:
      - ".github/workflows/publish-v1.4.12.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download signed artifact
        env:
          ARTIFACT_URL: "https://sdmntpraustraliaeast.oaiusercontent.com/files/00000000-47e8-81fa-a61a-3cbb22fb6a04/raw?se=2026-09-28T11%3A08%3A41Z&sp=r&sv=2026-02-06&sr=b&scid=5c4ed9af-7010-56e4-ab11-6fb36c518b29&skoid=f5e14fda-2af7-44a3-9d18-d372ffcad871&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-28T01%3A27%3A02Z&ske=2026-09-29T01%3A27%3A02Z&sks=b&skv=2026-02-06&sig=kSFPwBiytQt0%2B6Pzih4Otw1i9EH6lvzk/9HCSNJ06qw%3D"
        run: |
          set -euo pipefail
          curl -fL "$ARTIFACT_URL" -o /tmp/v1412.zip
          mkdir -p /tmp/v1412
          unzip -q /tmp/v1412.zip -d /tmp/v1412
          echo "698328b628932344c4e22c66e1ec3d9090967b24ca8fab8a3f30d4f0be776ec9  /tmp/v1412/ziwuxilv-native-v1.4.12.apk" | sha256sum -c -
      - name: Publish v1.4.12
        run: |
          set -euo pipefail
          mkdir -p android-native/v1.4.12
          cp /tmp/v1412/ziwuxilv-native-v1.4.12.apk android-native/v1.4.12/
          cp /tmp/v1412/ziwuxilv-native-v1.4.12.apk.sha256 android-native/v1.4.12/
          cat > android-native/version.json <<'JSON'
          {
            "versionCode": 30,
            "versionName": "1.4.12",
            "downloadUrl": "https://raw.githubusercontent.com/chaonpu/ziwuxilv/main/android-native/v1.4.12/ziwuxilv-native-v1.4.12.apk",
            "updateLog": "行情页网格标签精简：网格只显示“延时 / 滞后 / 待核验 / 未读取”，具体延时或滞后分钟数保留在点击后的行情详情中。广场发布窗口的“通过GitHub上传图片>>”会按App当前选择的讨论分类直接打开GitHub对应分类的新建Discussion页面，可直接填写并上传原生附件；发布窗口底部公开发布说明已移除。更新检测增加缓存规避与GitHub API二次核验。",
            "forceUpdate": false
          }
          JSON
          git rm .github/workflows/publish-v1.4.12.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android-native/version.json android-native/v1.4.12
          git commit -m "Publish Android v1.4.12"
          git push
