name: Community media tests

on:
  pull_request:
    paths:
      - 'tools/*.py'
      - 'tests/test_image*.py'
      - '.github/workflows/image-lifecycle*.yml'
      - 'tools/community_media.py'
      - 'tests/test_media*.py'
      - '.github/workflows/community-media*.yml'
      - '.github/workflows/profile-update.yml'
      - 'media/README.md'
      - 'storage/assets.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==12.3.0
      - run: python -m unittest discover -s tests -v

