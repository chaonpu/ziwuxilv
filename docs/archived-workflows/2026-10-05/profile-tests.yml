name: Profile Registry tests

on:
  pull_request:
    paths: ['tools/profile_registry.py', 'tests/test_profile*.py', 'profiles/**', '.github/workflows/profile-*.yml']
  push:
    branches: [main]
    paths: ['tools/profile_registry.py', 'tests/test_profile*.py', 'profiles/**', '.github/workflows/profile-*.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==12.3.0
      - run: python -m unittest discover -s tests -p 'test_profile*.py' -v
